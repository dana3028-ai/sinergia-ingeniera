    <text x="40" y="40" font-family="Sora,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#e8dcc6">Recuperación de capital</text>
  </g>
  <!-- grúa -->
  <g stroke="#a8844a" stroke-width="4" fill="none"><path d="M1130 480V250M1130 250h-110M1130 250l25 30M1020 250v40"/></g>
