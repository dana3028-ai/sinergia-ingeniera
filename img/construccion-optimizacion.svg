    <g fill="#e8dcc6" opacity=".25"><rect x="40" y="200" width="50" height="90"/><rect x="120" y="170" width="50" height="120"/><rect x="200" y="130" width="50" height="160"/><rect x="280" y="90" width="50" height="200"/></g>
    <g fill="#a8844a"><rect x="40" y="240" width="50" height="50"/><rect x="120" y="200" width="50" height="90"/><rect x="200" y="150" width="50" height="140"/><rect x="280" y="100" width="50" height="190"/></g>
    <path d="M30 270L150 190 230 150 350 60" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 60l-24 4M350 60l-6 22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="190" r="6" fill="#fff"/><circle cx="230" cy="150" r="6" fill="#fff"/>
