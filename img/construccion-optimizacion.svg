  <g transform="translate(90 70)" font-family="Sora,Segoe UI,sans-serif" font-size="20" fill="#e8dcc6"><text x="40" y="90">Espacio A</text><text x="46" y="260">Local</text><text x="370" y="110">Vivienda</text><text x="372" y="275">Renta</text></g>
  <!-- cotas -->
  <g stroke="#a8844a" stroke-width="3" fill="none"><path d="M90 440h520M90 430v20M610 430v20"/><path d="M640 70v340M630 70h20M630 410h20"/></g>
  <!-- gráfico de recuperación de capital -->
  <g transform="translate(700 90)">
