<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Limpieza de obra, hogares y naves industriales">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243f66"/><stop offset="1" stop-color="#12233b"/></linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8dcc6" stop-opacity=".55"/><stop offset="1" stop-color="#e8dcc6" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#cielo)"/>
  <circle cx="1010" cy="110" r="120" fill="url(#luz)"/>
  <!-- nave industrial -->
  <g>
    <path d="M60 360V230l130-60 130 60v130z" fill="#1b3354"/>
